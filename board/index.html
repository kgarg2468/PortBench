<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PortBench — build graph</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --text: #e6e8ee; --dim: #8a90a2;
    --pending: #3a3f4d; --running: #2f6feb; --done: #2ea56b; --failed: #d64545; --blocked: #6b5b1e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "SF Pro Text", Segoe UI, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 22px 8px; }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
  header .updated { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 8px 22px 22px; }
  #graph { background: var(--panel); border-radius: 12px; padding: 12px; min-height: 420px; overflow: auto; }
  #graph svg { max-width: 100%; height: auto; }
  aside { display: flex; flex-direction: column; gap: 8px; }
  .card { background: var(--panel); border-radius: 10px; padding: 10px 12px; border-left: 4px solid var(--pending); }
  .card.running { border-left-color: var(--running); }
  .card.done { border-left-color: var(--done); }
  .card.failed { border-left-color: var(--failed); }
  .card.blocked { border-left-color: var(--blocked); }
  .card b { display: block; font-size: 13px; }
  .card .status { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--dim); }
  .card .note { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .legend { display: flex; gap: 14px; padding: 0 22px 10px; color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: baseline; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>PortBench — build graph</h1><span class="updated" id="updated"></span></header>
<div class="legend">
  <span><span class="dot" style="background:var(--running)"></span>running</span>
  <span><span class="dot" style="background:var(--done)"></span>done</span>
  <span><span class="dot" style="background:var(--blocked)"></span>blocked</span>
  <span><span class="dot" style="background:var(--failed)"></span>failed</span>
  <span><span class="dot" style="background:var(--pending)"></span>pending</span>
</div>
<main>
  <div id="graph"></div>
  <aside id="cards"></aside>
</main>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
mermaid.initialize({ startOnLoad: false, theme: "dark", themeVariables: { fontFamily: "-apple-system, Segoe UI, sans-serif" } });

const FILL = { pending: "#3a3f4d", running: "#2f6feb", done: "#2ea56b", failed: "#d64545", blocked: "#6b5b1e" };
let lastRaw = "";

async function tick() {
  try {
    const res = await fetch("state.json?t=" + Date.now());
    const raw = await res.text();
    if (raw === lastRaw) return;
    lastRaw = raw;
    render(JSON.parse(raw));
  } catch (e) { /* keep last good render */ }
}

function render(state) {
  document.getElementById("updated").textContent = "updated " + new Date(state.updated).toLocaleTimeString();
  let def = "flowchart TD\n";
  for (const n of state.nodes) {
    def += `  ${n.id}["${n.label.replace(/\n/g, "<br/>")}"]\n`;
    def += `  style ${n.id} fill:${FILL[n.status] || FILL.pending},stroke:#00000044,color:#fff\n`;
    for (const d of n.deps) def += `  ${d} --> ${n.id}\n`;
  }
  mermaid.render("g" + Date.now(), def).then(({ svg }) => {
    document.getElementById("graph").innerHTML = svg;
  });
  document.getElementById("cards").innerHTML = state.nodes.map(n =>
    `<div class="card ${n.status}"><span class="status">${n.status}</span><b>${n.label.split("\n")[0]}</b><div class="note">${n.note || ""}</div></div>`
  ).join("");
}

tick();
setInterval(tick, 3000);
</script>
</body>
</html>
